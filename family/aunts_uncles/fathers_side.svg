<title>Grandparents, Great Aunts and Uncles, and Their Children</title>
<desc>Two-generation family tree. Generation one shows the five children of Peter Adolph and Anna Brita, including Joseph Edward and Emma Charlotta as the grandparents, ordered by sibling birth date. Generation two shows the children under the appropriate parent couple. Jack is shown as a child of Anna and Vic with a note reflecting the family relationship as remembered.</desc>
